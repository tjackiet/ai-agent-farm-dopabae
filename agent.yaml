# ドパバエ エージェント定義
#
# このファイルが数値パラメータの唯一の正 (single source of truth) です。
# 各 .md は「なぜその値なのか」を説明する文書であり、
# 値が食い違う場合は常に本ファイルを優先します。
#
# ハエ脳の値（fly 以下）は Stonkfly / 設計メモから写した候補値であり、
# 人間が確認するまで確定しません。檻（strategy / risk）の値はナンピノニクスから
# 持ち込んだ候補値です。型はナンピノニクスの agent.yaml に合わせています。

# 本ファイルの形式の版。エージェント本体のバージョンではありません。
schema_version: 1

# エージェント本体のバージョン。major.minor の2桁で管理します。
# 本項目だけがバージョン情報の唯一の正です。文字列で持ちます。
version: "0.1"

agent:
  # 名前は 2026-09-15 に人間が決めた（README.md「名前」）。
  # 由来：ドパ（ドーパミン。報酬学習で刺激する PAM11 細胞そのもの）＋バエ（ハエ／映え）。
  id: dopabae
  name: ドパバエ
  name_en: Dopabae
  tagline: ドパが出たことしか覚えない。
  archetype: connectome-approach-avoid # ハエ脳が方向を決め、決定的コード（檻）が数量・上限・諦めを決める型
  phase: design # design | paper | halted
  documents:
    personality: personality.md
    strategy: strategy.md
    risk_policy: risk-policy.md
    memory_policy: memory-policy.md
  # スキーマの見本。実行では書き換えない。
  status_file: status.yaml
  status_output: var/status.yaml
  performance_output: var/performance.yaml
  visual_profile_file: visual-profile.yaml # 追加予定

runtime:
  schedule: "*/15 * * * *" # 15分ごと（ナンピノニクスと同じ）
  timezone: Asia/Tokyo
  max_runtime_sec: 120 # 1回の判断にかける上限。シミュレーションが収まらなければ部分切り出しへ
  on_error: hold # 例外・不明時は必ず HOLD（発注しない）
  stale_tick_hours: 24

  # 同じ腕の二重起動を防ぐロック。前の回がまだ走っていれば、その回は何もしない。
  # 腕ごとに分ける（scripts/make_arm.py が書き換える）。分けないと腕が互いを止める。
  lock_path: var/run.lock

  dry_run: true # 発注を組み立てるだけ。paper へ出すかは、実口座で1周を確認してから人間が切り替える

market:
  exchange: bitbank
  quote_currency: jpy
  pairs:
    - btc_jpy

cli:
  command: bitbank
  package: bitbank-lab-cli
  repo: https://github.com/bitbankinc/bitbank-lab-cli
  install: "npm i -g bitbank-lab-cli"
  global_flags: ["--format=json", "--machine"]
  mode: paper # ペーパートレードのみ

  # 実行してはならないコマンド（実資金・実績破壊）
  forbidden:
    - "bitbank trade create-order"
    - "bitbank trade cancel-order"
    - "bitbank paper reset"

  observe:
    exchange_status: "bitbank status"
    circuit_break: "bitbank circuit-break {pair}"
    ticker: "bitbank ticker {pair}"
    candles_daily: "bitbank candles {pair} --type=1day"
    candles_hourly: "bitbank candles {pair} --type=1hour"
    candles_15min: "bitbank candles {pair} --type=15min"
    depth: "bitbank depth {pair}"
    pairs: "bitbank pairs"

  account:
    assets: "bitbank paper assets"
    pnl: "bitbank paper pnl --pair={pair}"
    active_orders: "bitbank paper active-orders"
    trade_history: "bitbank paper trade-history"

  act:
    resolve_fills: "bitbank paper tick"
    create_order: "bitbank paper create-order --pair={pair} --side={side} --type={type} --price={price} --amount={amount}"
    cancel_order: "bitbank paper cancel-order --id={order_id}"

  setup:
    init_account: "bitbank paper init --jpy=1000000"

  state_path: var/paper-state.json

capital:
  initial_jpy: 1000000

# 檻（決定的コード）。ハエが出した方向を受け取り、数量・価格・上限・諦めを決める。
# **ハエはこの値に触れない。** 値はナンピノニクスの agent.yaml から持ち込んだ候補値で、
# Phase 1 で人間が確認する。現物のみ（売りから入る建玉は作らない）。
strategy:
  spot_only: true

  entry:
    # APPROACH かつ建玉が上限未満かつクールダウン外のとき、固定額の指値を買い気配に置く。
    order_type: limit
    price_source: best_bid # 現在の買い気配
    budget_jpy_per_order: 100000 # 1回の買い金額（固定）
    max_pending_buy_orders: 1 # 未約定の買い指値は同時に1本まで。次回までに約定しなければ取り消す
    cooldown_hours_after_fill: 0.5
    max_fills_per_day: 16

  exit:
    # AVOID かつ建玉ありのとき、全量を指値で売り気配に置く。
    # 時間切れ・強制手仕舞いは方向によらず檻が出す。
    order_type: limit
    price_source: best_ask # 現在の売り気配
    sell_ratio: 1.0 # 全量
    time_stop_days: 3 # 建玉の保有上限。超過で全量手仕舞い

risk:
  max_position_ratio: 0.80 # 取得原価合計 / 初期資金
  min_cash_reserve_ratio: 0.10 # 常に残す現金比率
  per_order_max_jpy: 210000

  drawdown: # 総資産の初期比
    halt_new_buys_pct: -15.0 # 新規買い停止（AVOID による売りは維持）
    forced_exit_pct: -25.0 # 全建玉を成行で手仕舞い、停止

  guards:
    skip_on_circuit_break: true
    skip_on_exchange_maintenance: true
    max_data_age_sec: 300 # 5分より古いデータでは判断しない
    require_price_source: true # 価格は必ず CLI 応答由来

  states: [NOT_INITIALIZED, IDLE, HOLDING, HIBERNATING, HALTED]

# 方向の出どころ（docs/IMPLEMENTATION_PLAN.md Phase 1）。
#
# 方向は APPROACH / AVOID / NONE の三値。出どころは source で切り替える。
# ハエ版（fly）は Phase 3 で追加する。always_approach と random は評価用の対照群。
# 返せなかった・読めなかったときは on_failure に従う（既定 hold）。
direction:
  source: always_approach # always_approach | random | fly（Phase 3 で追加）
  on_failure: hold # hold のみ。シミュレーション失敗・入力欠損も hold
  random_seed: null # source=random のとき。null なら実行ごとに記録して固定する
  # source=random のときの三値の出しかた。null なら等確率。
  # 評価（docs/IMPLEMENTATION_PLAN.md Phase 4）では、比べる相手が同じ期間に出した
  # 頻度をここへ写す。頻度が違う対照群と比べても、方向の中身の差にならない。
  # python3 -m dopabae.evaluate が写すべき値を出す。
  random_weights: null # 例: {APPROACH: 0.5, AVOID: 0.2, NONE: 0.3}

# ハエ脳。読み出しの閾値・対象ニューロン・神経時間・報酬の閾値はここに置き、
# **ハエが書き換えない**（CLAUDE.md）。学習で変わるのはシナプス重みだけ。
#
# 以下の値は Stonkfly docs/model.md と docs/DESIGN_MEMO.md から写した候補値。
# ハエは方向しか出さない。数量・上限・諦めは上の strategy / risk（檻）が決める。
# 配線図の選定（要確認）が終わるまで確定しない。
fly:
  connectome:
    # 2026-09-16 に人間が MaleCNS v1.0 を選定した（docs/CONNECTOME_SURVEY.md 3・6 章）。
    # ライセンスは同日、権利者側の 5 箇所すべてを一次資料で確認して一致した（同 3.2）。
    source: malecns_v1_0 # MaleCNS v1.0（雄・脳＋腹髄）。FlyWire は採らない
    license: CC-BY-4.0 # NC 条項なし。版番号はリンク先からのみ判別できる（同 3.2）
    # 取得元。トークンを含む URL は置かない（Codex 由来の URL は API トークンを含む。同 3.6）。
    download_base: gs://flyem-male-cns/v1.0/ # 版がパスに入る。ログイン不要
    # データはリポジトリに含めない。取得 URL とチェックサムだけを置く（同 3.6）。
    vendored: false
    # 取得したデータの置き場所（Git 管理外）。scripts/fetch_connectome.py が書く。
    local_dir: var/connectome/malecns-v1.0
    # 使うファイルと指紋。2026-10-05 に取得して測った。中身が違えば読まない。
    # path は download_base からの相対。minconf-0.5 はシナプス検出の信頼度の下限で、
    # flat-connectome にはこの版しかない。**これもモデルの選択であってデータの性質ではない。**
    files:
      annotations: # 型名・左右・カラム座標（assignedOlHex1 / assignedOlHex2）
        path: connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
        sha256: 2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2
        size_bytes: 14483314
      weights: # 細胞どうしのシナプス数（body_pre / body_post / weight）
        path: connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
        sha256: e35da783d1c686b2b58b3b87cd6a403ae43bfcfba8bff28e08ef752c1a56afc1
        size_bytes: 1051241946
      neurotransmitters: # 細胞ごとの伝達物質の予測（符号を決める）
        path: connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather
        sha256: 95c9289220663abeb3409f3ad9e5a7f8a53f8093f5139d15502cd08da8879621
        size_bytes: 43282834
    # 切り出しの範囲。mushroom_body は採れない（視覚入力が KC に届く経路が切れる。同 2.3 章）。
    scope: null # full | visual_to_descending
    # シナプス数の閾値。これ未満の結合を落とす。null は閾値なし（Stonkfly と同じ 25.6M）。
    # **モデルの選択であってデータの性質ではない。** 3 で 10.5M、5 で 6.2M になる（同 2.1 章）。
    # 2026-10-05、status が Traced の細胞どうしで数えて 3 つとも再現した（同 2.1）。
    synapse_threshold: null

  # 画像から光受容細胞への入力（Phase 2 後半）。
  # **どれも設計者が決めた読み替えであり、生体の視野との一致は検証されていない。**
  # 2026-10-05 から、既定値は Stonkfly に合わせてある（docs/CONNECTOME_SURVEY.md 1.1）。
  # Phase 2 で設計者が選んだやりかた（shared / area / blue_green_mean）は選択肢として残し、
  # Phase 4 の腕で差を測れるようにしてある。
  retina:
    # カラム座標の表（body_id / cell_type / hex1 / hex2 / side の TSV）。
    # scripts/export_column_map.py が MaleCNS v1.0 から書き出す。光受容細胞は
    # assignedOlHex を持たないので、標的（シナプス後の細胞）のカラムから決める
    # （docs/IMPLEMENTATION_PLAN.md Phase 2「座標表の作りかた」）。
    # **配線図データはリポジトリに含めない**（docs/CONNECTOME_SURVEY.md 3.6）。
    column_map_path: var/column_map.tsv # Git 管理外
    # 受容細胞の型名。2026-10-05 に MaleCNS v1.0 の実データで確かめた。
    # R1–R6 は 1 つの型（R1-R6）にまとまっていて、個別の R1〜R6 は無い。
    luminance_types: [R1-R6] # 輝度を受け取る（R1–R6）
    # R1-R6 の座標を決めるときに数える標的の型。null は座標を持つ全標的（Phase 2 の選択）。
    # Stonkfly は L1・L2・L3 だけを数える（3,335 個に座標が付く）。R8 は常に全標的で決める。
    luminance_anchor_types: [L1, L2, L3]
    # R8 は R8p / R8y / R8d / R8_unclear に分かれている。p / y の 2 型だけを使う
    # （合計 811 個。Stonkfly の「R8 811 個」と一致する）。
    # R8d（背側縁）と R8_unclear（p / y が決まっていない）には値を作らない。
    blue_green_types: [R8p, R8y] # 青／緑を受け取る（R8）
    # R8 は個眼ごとに Rh5（青）と Rh6（緑）へ分かれる。MaleCNS の型名は p / y を
    # 区別している（p→Rh5・y→Rh6 の対応は文献の知見で、データには書かれていない）。
    # by_subtype は R8p に青、R8y に緑を渡す（Stonkfly と同じ）。
    r8_channel: by_subtype # by_subtype | blue_green_mean | blue | green
    # 両眼の置きかた。split_eyes は左眼を画像の左、右眼を右に置き、中央が重なる
    # （Stonkfly と同じ。右眼は左右を反転）。shared は両眼とも画像全体を同じ座標で見る（Phase 2）。
    layout: split_eyes # split_eyes | shared
    eye_width: 0.6 # split_eyes で 1 眼が占める画像の幅（割合）。0.6 で中央 20% が重なる
    # 画素の拾いかた。point は中心の 1 画素（Stonkfly と同じ）。area は範囲の平均（Phase 2）。
    # point では、1 画素の破線の気配が当たるかどうかが位置で決まる（Phase 2 の論点）。
    sampling: point # point | area
    # area のときに 1 個が見る画素の範囲（正方形の一辺）。null は格子の目の粗さから決める。
    field_px: null
    # shared のときに格子を画像へ置く向き。**複眼の視野との対応は未確認。**
    flip_x: false
    flip_y: true # hex2 が増える向きを画像の上にする（split_eyes も同じ向き）

  vision:
    width: 320
    height: 180
    background: light # 暗い背景では KC がほぼ発火しなかった（Stonkfly）
    candle_type: 15min
    lookback_candles: 8 # 直近2時間。目安は2時間〜1日
    show: [candles, pair, bid, ask]
    hide: [balance, pnl, position] # ハエに「自分の懐」を見せない
    # 描画に使う色（RGB）。明るい背景に、上昇足は緑、下落足は赤。
    # R8 は青／緑の代理値を受け取るので、色の選びかたは入力に効く。Phase 2 後半で見直す。
    palette:
      background: [245, 245, 245]
      text: [40, 40, 40]
      up: [0, 150, 60]
      down: [200, 40, 40]
      wick: [90, 90, 90]
      bid: [30, 90, 200]
      ask: [200, 120, 30]
    margin_px: 8 # 枠からの余白
    text_rows_px: 12 # 上部の文字行（ペア名・気配）に使う高さ
    receptors:
      luminance: [R1, R2, R3, R4, R5, R6] # 線形 sRGB 輝度
      color: [R8] # 青／緑の代理値

  # LIF の値。Shiu ら (2024) を Stonkfly が再利用した値（docs/CONNECTOME_SURVEY.md 5 章）。
  # **どれも候補値。** 2026-10-05 から Stonkfly の網の作りかたに合わせてある（同 1.1）。
  simulation:
    model: lif
    dt_ms: 0.1
    neural_time_per_observation_sec: 0.5
    membrane_tau_ms: 20
    synaptic_tau_ms: 5
    resting_mv: -52 # 静止電位
    reset_mv: -52 # 発火したあとに戻す電位（静止電位との差を、各細胞の静止電位に足して使う）
    threshold_mv: -45
    transmission_delay_ms: 1.8
    refractory_ms: 2.2
    weight_per_synapse_mv: 0.275 # シナプス 1 個あたり。結合の重みはシナプス数 × これ
    # 不応期中の細胞に届いた入力。drop は捨てる（Stonkfly）。keep は足す（Brian2）。
    refractory_input: drop # drop | keep
    # 網に入れる細胞。superclass が付いていて status が Glia でないもの（Stonkfly と同じ。
    # 166,700 細胞・25,582,938 結合）。
    neuron_policy: assigned_superclass
    # 結合の符号。伝達物質の列と、抑制として扱う物質。判定できない・欠損は興奮（Stonkfly と同じ）。
    # **光受容細胞はヒスタミンなので抑制になる。**
    transmitter_column: consensus_nt
    inhibitory_transmitters: [gaba, glutamate, histamine]
    # これだけを出す細胞の発火は、行き先の膜電位を動かさない（速い作用を持たせない。Stonkfly と同じ）。
    modulatory_transmitters: [dopamine, octopamine, serotonin]
    # R8 → aMe12 の結合だけ符号を正にする（Xiao ら 2023。Stonkfly と同じ。転用は仮定）。
    r8_to_ame12_excitatory: true
    # KC（型名が KC で始まる細胞）。静止電位と、発火ごとに足される適応（Stonkfly と同じ）。
    kc:
      resting_mv: -60
      adaptation_mv: 8
      adaptation_tau_ms: 200
    # 背景の活動。ラミナに一定の電流を流し、何も見ていなくても発火させる（Stonkfly と同じ）。
    # 光受容細胞（ヒスタミン＝抑制）の入力は、この発火を減らす形で下流へ届く。
    # **Stonkfly 自身が「検証された網膜の生理ではない」と注記している。**
    lamina:
      types: [L1, L2, L3, L5]
      bias_mv: 12
    # 光受容細胞への入力。明るさ L（0〜1）を時定数 smoothing_ms で平滑化し、
    # max_mv × L / (half_saturation + L) の一定電流にする（Stonkfly と同じ）。
    # chunk_ms ごとに平滑化した値を更新し、そのあいだは電流を変えない。
    photoreceptor_input:
      max_mv: 30
      half_saturation: 0.02
      smoothing_ms: 10
      chunk_ms: 10
    # 観測をまたいで網の状態を引き継ぐ（Stonkfly と同じ）。毎回静止状態から始めると、
    # 0.5 秒の初めが立ち上がりの過渡応答になる。状態は checkpoint_path に保存する（Git 管理外）。
    carry_state: true
    checkpoint_path: var/fly/state.npz

  readout:
    # 接近の指標 − 回避の指標 の1本の軸。正の閾値超で APPROACH、負の閾値未満で AVOID、間は NONE。
    # 設計者が決めた読み替えであり、「売買を判断する細胞」ではない。
    # 対象ニューロン群は未決（候補は docs/DESIGN_MEMO.md 3.3 節）。配線図の選定後に人間が決める。
    approach_neurons: null # 接近・定位に関わる下行性ニューロン、接近側 MBON など
    avoid_neurons: null # 逃避回路（LC4 / LPLC2 → DNp01）、回避側 MBON など
    approach_threshold_hz: null # 未決。Phase 3 で決め、人間が確認する
    avoid_threshold_hz: null # 未決。負の値

  reward:
    enabled: false # Phase 5 まで無効。学習なしで動かす
    trigger: position_closed # 決済が確定した回だけ。観測ごとには出さない
    threshold_jpy: null # 手数料より十分大きい値。Phase 5 で決める
    reward_cells: PAM11 # 報酬 15 細胞（Stonkfly と同じ細胞群から始める）
    aversive_cells: PPL101 # 嫌悪 2 細胞
    plasticity_edges: [KC->MBON07, KC->MBON11]
    rule: anti_hebbian # まずは Stonkfly と同じ（抑圧のみ）
    memory_decay_sec: null # Stonkfly は 1,800 秒。運用スケール（日〜週）に伸ばす。未検証
    weight_snapshot_every_n: 96 # 何回の観測ごとに重みを保存するか（15分間隔なら1日）

# 記録の言語化。日誌の「おれの一日」を、ドパバエ自身の言葉で書く。
#
# **売買の判断には一切関与しない。** 書くのは記録の文章だけで、発注・取消・HOLD の
# 決定は決定的なコード（檻）が行う。書けなければ「（未記入）」のまま残り、運用は続く。
#
# 数字はハエの言葉に混ぜない（personality.md「数字の扱い」）。観測は日誌の別の節へ
# 判断ログからそのまま転記する。
#
# ナンピノニクスにある「学び」は作らない。ドパバエは反省も計画もしないし、
# 学習が起きるのはシナプス重みだけである（CLAUDE.md）。
narrate:
  enabled: true

  # claude_code = Claude Code CLI を非対話で呼ぶ（claude -p）
  # api        = Anthropic API を直接呼ぶ（別途 pip install anthropic）
  writer: claude_code
  command: claude
  timeout_sec: 120

  # writer=claude_code のとき --bare を付けるか。
  #
  # false: Claude Code のログイン（サブスクリプション）をそのまま使える。ただし
  #        CLAUDE.md・フック・MCP を毎回読み込むため重く、フックも発火する。
  # true : 起動が軽く副作用もないが、**サブスクリプションを使わない**。
  #        ANTHROPIC_API_KEY が必須になり、API クレジットから引かれる。
  bare: false

  # Fable / Mythos 系は使わない（料金が上位帯のため）。config.py が弾く。
  model: claude-sonnet-5
  effort: high # low | medium | high | xhigh | max
  max_tokens: 500 # writer=api のときだけ使う
  targets:
    daily: true # 日誌の本文

memory:
  root: var/memory/
  decisions:
    path: "var/memory/decisions/{date}.jsonl"
    retention_days: 90
    read_last_n: 16
  daily:
    path: "var/memory/daily/{date}.md"
    write_at: "23:50"
    read_last_n: 7
  lessons:
    path: var/memory/lessons.md
    max_entries: 50
    write_trigger: position_closed
  weights:
    path: "var/memory/weights/{date}.npz" # シナプス重みのスナップショット。Git 管理外
  vision:
    # ハエに見せた画像。人間が「何を見せたか」を確認するために PNG で残す。Git 管理外。
    # ハッシュと足の範囲は判断ログにも残る。
    path: "var/memory/vision/{date}/{run_id}.png"
  redact: # 記憶に書き込んではならない値
    - api_key
    - api_secret
    - profile_name
