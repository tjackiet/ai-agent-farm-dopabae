# セキュリティの定期点検。公開リポジトリなので、いずれも追加費用なしで動く。
#
# 見るのは2つ。
#
# - CodeQL … コードの脆弱性（GitHub の Security タブに出る）
# - pip-audit … 依存に既知の脆弱性が出ていないか
#
# 資格情報そのものの流出は GitHub の Secret scanning（リポジトリ設定）に任せる。
# CLAUDE.md「API キー・シークレット・プロファイル名は、ログにも記憶にも残さない」
# の担保は、記録側のテスト（tests/）が受け持つ。
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週火曜 05:00 JST。依存を足していない週でも、新しく出た脆弱性に気づくため。
    - cron: "0 20 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 既知の脆弱性を見る
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
