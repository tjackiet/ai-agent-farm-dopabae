# テスト。agent.yaml が CLAUDE.md の不変ルールを満たしていることと、
# 檻・読み出しの実装（Phase 1 以降）が壊れていないことを、PR ごとに確かめる。
#
# テストは外に出ない。`bitbank` も `claude` もシミュレーションも呼ばない。
# したがって資格情報も実取引も配線図データも CI には要らない。
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 は Stonkfly の環境要件（docs/IMPLEMENTATION_PLAN.md 3 節）。
        # 3.14 は 2026-09-15 に実機で 1 周を確認した版。手元で動く版を CI が見ていないと、
        # 壊れたことに運用中まで気づけない。
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存を入れる
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -t .
