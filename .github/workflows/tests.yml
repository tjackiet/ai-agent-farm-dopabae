# テスト。agent.yaml が CLAUDE.md の不変ルールを満たしていることと、
# 檻・読み出しの実装（Phase 1 以降）が壊れていないことを、PR ごとに確かめる。
#
# テストは外に出ない。`bitbank` も `claude` もシミュレーションも呼ばない。
# したがって資格情報も実取引も配線図データも CI には要らない。
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 運用は 3.11（Stonkfly の環境要件。docs/IMPLEMENTATION_PLAN.md 3 節の未確認の前提）。
        # 新しい版も回して、動かなくなったことに早く気づく。
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存を入れる
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -t .
